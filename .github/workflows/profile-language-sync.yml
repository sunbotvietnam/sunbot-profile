name: Sunbot profile language sync

on:
  push:
    paths:
      - '.github/workflows/profile-language-sync.yml'

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply profile migration
        run: python3 tools/profile_sync.py
      - name: Commit profile
        run: |
          git config user.name "sunbotvietnam"
          git config user.email "kiroteam2025@gmail.com"
          git add index.html
          git commit -m "Restore full Sunbot profile and localize 2026 messaging [profile-sync]" || exit 0
          git push
